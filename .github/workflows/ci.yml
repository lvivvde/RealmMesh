name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Two explicit jobs rather than a matrix: only the dependency steps differ
  # (Homebrew's keg-only OpenSSL here, apt plus the pinned libmsquic package on
  # Linux), while configure/build/test are identical. macOS serves TLS/TCP
  # only, so the QUIC paths are covered by the linux job alone (ADR-0002).
  macos:
    name: macOS (clang, kqueue backend)
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Check out
        uses: actions/checkout@v5

      # openssl@3 is keg-only on Homebrew, so CMake's find_package(OpenSSL)
      # cannot see it without an explicit root; the CLI is put first on PATH
      # because the TLS test identity is generated with `openssl req -addext`.
      - name: Install dependencies
        run: |
          brew install openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"

      # 跨进程集成用例自带单节点真实 etcd(网关的准入消费存储是线性一致
      # 存储,attach 路径真实依赖它,见 ADR-0009),所以这一步是全量 ctest 的
      # 硬前置:二进制缺失时那些用例会明确失败而不是跳过。安装脚本同时验证
      # 固定版本 + 校验和在 runner 上可用。
      - name: Install etcd
        run: ./scripts/install-etcd.sh

      - name: Show toolchain
        run: |
          cmake --version
          c++ --version

      - name: Configure
        run: cmake --preset dev

      - name: Build
        run: cmake --build --preset dev

      - name: Test
        run: ctest --preset dev

  # Linux is the production and behaviour baseline (ADR-0002), and the only job
  # where QUIC runs. It is not merely "also built here": on Linux
  # third_party/msquic/CMakeLists.txt fails the configure outright when
  # libmsquic is missing, so a green run proves the QUIC transport was built
  # and its tests executed rather than silently skipped.
  linux:
    name: Linux (gcc, epoll backend, QUIC)
    # Pinned to 24.04 on purpose: scripts/install-msquic-dev.sh verifies the
    # SHA-256 of the official libmsquic 2.5.10 package built for 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out
        uses: actions/checkout@v5

      # libxdp/libnl/libnuma are libmsquic's runtime dependencies; the project
      # looks them up by soname, so the runtime packages are sufficient.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev libxdp1 libnl-3-200 libnl-route-3-200 libnuma1
          ./scripts/install-msquic-dev.sh

      # 同 macOS:跨进程集成用例要拉起真实 etcd,缺失即失败(不跳过)。
      - name: Install etcd
        run: ./scripts/install-etcd.sh

      - name: Show toolchain
        run: |
          cmake --version
          c++ --version

      - name: Configure
        run: cmake --preset dev

      - name: Build
        run: cmake --build --preset dev

      - name: Test
        run: ctest --preset dev

      - name: Linux M1-M4 acceptance
        env:
          REALMMESH_LINUX_ACCEPTANCE_SKIP_BUILD: "1"
        run: ./scripts/run-linux-login-acceptance.sh

      - name: Upload Linux acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-login-chain-m1-m4
          path: |
            build/dev/acceptance/linux-login-chain-m1-m4.md
            build/dev/acceptance/linux-login-chain-m1-m4.log
          if-no-files-found: warn
