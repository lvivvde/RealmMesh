name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ccache_acceptance:
        description: Run three isolated remote-cache acceptance pairs after full correctness
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# configure / build / test / acceptance all use this one preset name; the build
# directory is the binaryDir CMake recorded at configure time (#122), resolved by
# scripts/build-dir.sh rather than assumed from the preset name.
#
# Resource budget (#125): compile with 2 jobs, always passed explicitly rather
# than left to the generator default; run the full ctest serially (-j 1), the
# same as ./scripts/build.sh. Only the edit-loop entry ./scripts/test-fast.sh
# runs Unit tests in parallel.
#
# Generator (#123): the dev preset uses Ninja (>= 1.11; libraries and programs
# link in a depth-1 pool, test executables outside it); both jobs install it
# explicitly instead of relying on the runner image. The dev-make preset stays
# the Make fallback for local use.
env:
  REALMMESH_CI_PRESET: dev
  REALMMESH_CI_BUILD_JOBS: 2

jobs:
  # Two explicit jobs rather than a matrix: only the dependency steps differ
  # (Homebrew's keg-only OpenSSL here, apt plus the pinned libmsquic package on
  # Linux), while configure/build/test are identical. This job installs no
  # libmsquic, so it builds TLS/TCP only and the QUIC paths are covered by the
  # linux job alone; developer Macs with Homebrew libmsquic build QUIC locally
  # (ADR-0012).
  macos:
    name: macOS (clang, kqueue backend)
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
    steps:
      - name: Check out
        uses: actions/checkout@v5

      # openssl@3 is keg-only on Homebrew. cmake/RealmMeshOpenSSL.cmake would
      # default to its prefix, but CI names the root explicitly (#121); the CLI
      # is put first on PATH because the TLS test identity is generated with
      # `openssl req -addext`.
      - name: Install dependencies
        run: |
          brew install openssl@3 ninja ccache
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"

      # 跨进程集成用例自带单节点真实 etcd(网关的准入消费存储是线性一致
      # 存储,attach 路径真实依赖它,见 ADR-0009),所以这一步是全量 ctest 的
      # 硬前置:二进制缺失时那些用例会明确失败而不是跳过。安装脚本同时验证
      # 固定版本 + 校验和在 runner 上可用。
      - name: Install etcd
        run: ./scripts/install-etcd.sh

      # Player Data 的权威来源是 MongoDB 副本集(ADR-0011):存储层与跨进程
      # 集成用例各自拉起单节点 rs0。macOS 与开发机一致，用 Homebrew 安装;
      # 夹具与脚本从 PATH 找 mongod/mongosh,缺失即失败而不是跳过。
      # 新版 Homebrew 拒绝加载未信任第三方 tap 的公式，须先 brew trust。
      - name: Install MongoDB
        run: |
          brew tap mongodb/brew
          brew trust mongodb/brew
          brew install mongodb-community mongosh

      - name: Show toolchain
        run: |
          cmake --version
          ninja --version
          ccache --version
          c++ --version

      - name: Start cache restore timer
        if: inputs.ccache_acceptance != true
        id: ccache-restore-time
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Compiler cache compatibility bucket
        if: inputs.ccache_acceptance != true
        id: ccache-key
        run: python3 scripts/ci-ccache-key.py

      - name: Restore compiler cache
        if: inputs.ccache_acceptance != true
        id: ccache-restore
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache-key.outputs.key }}
          restore-keys: ${{ steps.ccache-key.outputs.bucket }}-

      - name: Cache restore result
        if: inputs.ccache_acceptance != true
        run: |
          echo "cache check+restore: outcome=${{ steps.ccache-restore.outcome }}, hit=${{ steps.ccache-restore.outputs.cache-hit }}, seconds=$(( $(date +%s) - ${{ steps.ccache-restore-time.outputs.start }} ))"
          mkdir -p "$CCACHE_DIR"
          ccache --zero-stats

      - name: Configure
        if: inputs.ccache_acceptance != true
        run: |
          cmake --preset "$REALMMESH_CI_PRESET" -DREALMMESH_CCACHE=ON -DREALMMESH_CCACHE_DIR="$CCACHE_DIR" -DREALMMESH_CCACHE_MAX_SIZE=2GiB
          build_dir="$(./scripts/build-dir.sh --preset "$REALMMESH_CI_PRESET")"
          echo "REALMMESH_BUILD_DIR=${build_dir}" >> "$GITHUB_ENV"
          echo "CCACHE_CONFIGPATH=${build_dir}/realmmesh-ccache.conf" >> "$GITHUB_ENV"

      - name: Compiler cache acceptance (three pairs)
        if: github.event_name == 'workflow_dispatch' && inputs.ccache_acceptance == true
        uses: ./.github/actions/ccache-acceptance
        with:
          preset: ${{ env.REALMMESH_CI_PRESET }}
          jobs: ${{ env.REALMMESH_CI_BUILD_JOBS }}

      - name: Build
        if: inputs.ccache_acceptance != true
        run: cmake --build --preset "$REALMMESH_CI_PRESET" --parallel "$REALMMESH_CI_BUILD_JOBS"

      - name: Test
        if: inputs.ccache_acceptance != true
        run: ctest --preset "$REALMMESH_CI_PRESET" -j 1


      - name: Compiler cache statistics
        if: always()
        continue-on-error: true
        run: ccache --show-stats --verbose

      # Only successful main pushes/maintenance dispatches publish. PRs restore
      # and compile normally, but never save a shared snapshot. Weekly immutable
      # keys limit archive churn; restore cannot cross the compatibility prefix.
      - name: Start cache save timer
        id: ccache-save-time
        if: success() && inputs.ccache_acceptance != true && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.ccache-restore.outputs.cache-hit != 'true'
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Save compiler cache
        id: ccache-save
        if: success() && steps.ccache-save-time.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache-key.outputs.key }}

      - name: Cache save result
        if: always() && steps.ccache-save-time.outcome == 'success'
        run: echo "cache save outcome=${{ steps.ccache-save.outcome }}, seconds=$(( $(date +%s) - ${{ steps.ccache-save-time.outputs.start }} ))"

  # Linux is the production and behaviour baseline (ADR-0002), and the only job
  # where QUIC runs. It is not merely "also built here": on Linux
  # third_party/msquic/CMakeLists.txt fails the configure outright when
  # libmsquic is missing, so a green run proves the QUIC transport was built
  # and its tests executed rather than silently skipped.
  linux:
    name: Linux (gcc, epoll backend, QUIC)
    # Pinned to 24.04 on purpose: scripts/install-msquic-dev.sh verifies the
    # SHA-256 of the official libmsquic 2.6.1 package built for 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
    steps:
      - name: Check out
        uses: actions/checkout@v5

      # libnuma is libmsquic's only runtime dependency beyond OpenSSL; the
      # project looks it up by soname, so the runtime package is sufficient.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libnuma1 ninja-build ccache
          ./scripts/install-msquic-dev.sh

      # 同 macOS:跨进程集成用例要拉起真实 etcd,缺失即失败(不跳过)。
      - name: Install etcd
        run: ./scripts/install-etcd.sh

      # 同 macOS:Player Data 用例要拉起真实 MongoDB 副本集。Linux 装固定
      # 版本 + 校验和到 .tools/,夹具与脚本在 PATH 之后退回那里查找。
      - name: Install MongoDB
        run: ./scripts/install-mongodb.sh

      - name: Show toolchain
        run: |
          cmake --version
          ninja --version
          ccache --version
          c++ --version

      - name: Start cache restore timer
        if: inputs.ccache_acceptance != true
        id: ccache-restore-time
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Compiler cache compatibility bucket
        if: inputs.ccache_acceptance != true
        id: ccache-key
        run: python3 scripts/ci-ccache-key.py

      - name: Restore compiler cache
        if: inputs.ccache_acceptance != true
        id: ccache-restore
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache-key.outputs.key }}
          restore-keys: ${{ steps.ccache-key.outputs.bucket }}-

      - name: Cache restore result
        if: inputs.ccache_acceptance != true
        run: |
          echo "cache check+restore: outcome=${{ steps.ccache-restore.outcome }}, hit=${{ steps.ccache-restore.outputs.cache-hit }}, seconds=$(( $(date +%s) - ${{ steps.ccache-restore-time.outputs.start }} ))"
          mkdir -p "$CCACHE_DIR"
          ccache --zero-stats

      - name: Configure
        if: inputs.ccache_acceptance != true
        run: |
          cmake --preset "$REALMMESH_CI_PRESET" -DREALMMESH_CCACHE=ON -DREALMMESH_CCACHE_DIR="$CCACHE_DIR" -DREALMMESH_CCACHE_MAX_SIZE=2GiB
          build_dir="$(./scripts/build-dir.sh --preset "$REALMMESH_CI_PRESET")"
          echo "REALMMESH_BUILD_DIR=${build_dir}" >> "$GITHUB_ENV"
          echo "CCACHE_CONFIGPATH=${build_dir}/realmmesh-ccache.conf" >> "$GITHUB_ENV"

      - name: Compiler cache acceptance (three pairs)
        if: github.event_name == 'workflow_dispatch' && inputs.ccache_acceptance == true
        uses: ./.github/actions/ccache-acceptance
        with:
          preset: ${{ env.REALMMESH_CI_PRESET }}
          jobs: ${{ env.REALMMESH_CI_BUILD_JOBS }}

      - name: Build
        if: inputs.ccache_acceptance != true
        run: cmake --build --preset "$REALMMESH_CI_PRESET" --parallel "$REALMMESH_CI_BUILD_JOBS"

      - name: Test
        if: inputs.ccache_acceptance != true
        run: ctest --preset "$REALMMESH_CI_PRESET" -j 1

      - name: Linux M1-M4 acceptance
        if: inputs.ccache_acceptance != true
        env:
          REALMMESH_LINUX_ACCEPTANCE_SKIP_BUILD: "1"
        run: ./scripts/run-linux-login-acceptance.sh --preset "$REALMMESH_CI_PRESET"

      - name: Upload Linux acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-login-chain-m1-m4
          path: |
            ${{ env.REALMMESH_BUILD_DIR }}/acceptance/linux-login-chain-m1-m4.md
            ${{ env.REALMMESH_BUILD_DIR }}/acceptance/linux-login-chain-m1-m4.log
          if-no-files-found: warn

      - name: Compiler cache statistics
        if: always()
        continue-on-error: true
        run: ccache --show-stats --verbose

      # Only successful main pushes/maintenance dispatches publish. PRs restore
      # and compile normally, but never save a shared snapshot. Weekly immutable
      # keys limit archive churn; restore cannot cross the compatibility prefix.
      - name: Start cache save timer
        id: ccache-save-time
        if: success() && inputs.ccache_acceptance != true && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.ccache-restore.outputs.cache-hit != 'true'
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Save compiler cache
        id: ccache-save
        if: success() && steps.ccache-save-time.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache-key.outputs.key }}

      - name: Cache save result
        if: always() && steps.ccache-save-time.outcome == 'success'
        run: echo "cache save outcome=${{ steps.ccache-save.outcome }}, seconds=$(( $(date +%s) - ${{ steps.ccache-save-time.outputs.start }} ))"
