data_dir: /tmp/vector

sources:
  ingest:
    type: vector
    address: 0.0.0.0:6000
    tls:
      enabled: true
      ca_file: /etc/realmmesh/certs/ca.crt
      crt_file: /etc/realmmesh/certs/gateway.crt
      key_file: /etc/realmmesh/certs/gateway.key
      verify_certificate: true
  vector_metrics:
    type: internal_metrics

transforms:
  normalize_metadata:
    type: remap
    inputs: [ingest]
    source: |-
      if !exists(.correlation_id) { .correlation_id = "" }
      if !exists(.request_id) { .request_id = "" }

sinks:
  loki:
    type: loki
    inputs: [normalize_metadata]
    endpoint: http://loki:3100
    out_of_order_action: accept
    compression: snappy
    encoding:
      codec: json
    labels:
      environment: "{{ environment }}"
      cluster: "{{ cluster }}"
      service_name: "{{ service_name }}"
      severity: "{{ severity }}"
      kind: "{{ kind }}"
    structured_metadata:
      correlation_id: "{{ correlation_id }}"
      request_id: "{{ request_id }}"
      service_instance: "{{ service_instance }}"
      process_start_id: "{{ process_start_id }}"
      sequence: "{{ sequence }}"
    acknowledgements:
      enabled: true

  prometheus:
    type: prometheus_exporter
    inputs: [vector_metrics]
    address: 0.0.0.0:9598
