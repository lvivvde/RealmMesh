# RealmMesh 六条 v1 告警(#34 定案;门槛初值,#48 压测校准)。
# 告警表达式只引用代码真实暴露的指标名(一致性校验见
# service_host_test 的 ObservabilityArtifactsMatchRegistry:改名会
# 在测试层失败,不会静默弄瞎告警)。
groups:
  - name: realmmesh-admission
    rules:
      # 1) 放行停滞:放行速率在跑,但 5 分钟窗口内 released_number 无增量。
      - alert: QueueAdmissionStalled
        expr: admit_rate > 0 and delta(released_number[5m]) == 0
        labels:
          severity: critical
        annotations:
          summary: 排队放行停滞(admit_rate > 0 但 released_number 5m 无增量)
          description: >-
            实例 {{ $labels.instance }} 的放行阀门看起来在运行,最近 5
            分钟却没有号牌被放行。优先排查额度轮询与放行帧日志。

      # 2) 额度收敛超时(#34:实例死亡后其额度仍被计入 > 10s):v1 用
      #    实例自身指标作代理——放行在跑但没有网关上报 conn_free(实例
      #    死亡后序列 stale,absent 命中),或总量已归零。两侧先聚合成
      #    无标签向量再 and,否则跨服务标签集不相交永不触发。etcd 租约
      #    视角的精确观测属平台侧 exporter,#32 校准后替换。
      - alert: BudgetConvergenceTimeout
        expr: >-
          sum(admit_rate) > 0
            and (absent(edge_budget{kind="conn_free"})
                 or sum(edge_budget{kind="conn_free"}) == 0)
        for: 10s
        labels:
          severity: critical
        annotations:
          summary: 额度收敛超时(conn_free 总和为 0 超过 10s)
          description: >-
            放行仍在进行,但全部网关实例的可用连接额度归零;若伴随实例
            死亡,说明 etcd 租约未及时剔除其额度。

      # 3) fetching 堆积:管线预算占用 >90% 持续 1 分钟。fetch_used 即
      #    fetching 会话数,故 fetching > 9×fetch_free 等价于占用超九成
      #    (两指标标签集不同,ignoring 对齐到实例)。
      - alert: EdgeFetchingSaturated
        expr: >-
          edge_sessions{stage="fetching"}
            / ignoring(stage, kind) edge_budget{kind="fetch_free"} > 9
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: 网关 fetching 占用超管线预算 90% 持续 1 分钟
          description: >-
            实例 {{ $labels.instance }} 的拉取阶段接近满载,新准入将
            开始排队;确认拉取源延迟或预算水位。

      # 4) 拉取失败率:5 分钟窗口内重试占比 > 1%(分母 = 重试次数 +
      #    成功拉取次数,直方图 count 即成功交付次数)。
      - alert: EdgeFetchFailureRateHigh
        expr: >-
          increase(edge_fetch_retry_total[5m])
            / (increase(edge_fetch_retry_total[5m])
               + increase(edge_fetch_duration_seconds_count[5m])) > 0.01
        labels:
          severity: warning
        annotations:
          summary: 网关拉取失败率超 1%(5 分钟窗口)
          description: >-
            实例 {{ $labels.instance }} 拉取重试占比过高;检查拉取源
            健康度与 edge_fetch_duration_seconds 分布。

      # 5) verify 5xx:健全服无状态码标签,以请求守恒式探测未决请求
      #    (请求 = 签发 + 分档拒绝 + 其余;其余占比即 5xx/超时类)。
      - alert: VerifyUnresolvedRequestsHigh
        expr: >-
          (increase(verify_requests_total[5m])
             - increase(verify_issue_duration_seconds_count[5m])
             - sum without(reason)(increase(verify_reject_total[5m])))
            / increase(verify_requests_total[5m]) > 0.001
        labels:
          severity: warning
        annotations:
          summary: 健全服未决请求占比超 0.1%(5 分钟窗口)
          description: >-
            实例 {{ $labels.instance }} 的 verify 请求既未签发也未落入
            已知拒绝分档,相当于 5xx/超时类路径。当前已接线的路径
            (签发 + 三档拒绝)守恒归零,该告警触发即出现了新的未决
            返回路径,需要排查代码。

      # 6) CDN 卸载失效:progress 源站直查速率超过 5 万 QPS(缓存命中
      #    失效或 CDN 配置异常时流量会直接打到排队调度服)。
      - alert: CdnOffloadIneffective
        expr: sum(rate(progress_requests_total[1m])) > 50000
        labels:
          severity: warning
        annotations:
          summary: progress 源站直查超 5 万 QPS(CDN 卸载失效)
          description: >-
            progress 请求本应由 CDN 缓存承接;源站速率超阈值说明卸载
            失效,检查缓存 TTL 与回源配置。
