syntax = "proto3";

package realmmesh.protocol.edge.v1;

option optimize_for = LITE_RUNTIME;

// Numeric values are permanent wire identifiers. Never reuse a removed value.
enum MessageId {
  MESSAGE_ID_UNSPECIFIED = 0;

  // 已退役的编号,永久作废、不复用:1001 C2S_LOGIN_REQUEST、
  // 1002 S2C_LOGIN_SUCCEEDED、1101 C2S_REALM_AUTHENTICATE、
  // 1102 S2C_CHARACTER_LIST、1103 C2S_SELECT_CHARACTER、
  // 1104 S2C_ENTER_GAME_ISSUED、1201 C2S_ENTER_GAME、
  // 1202 S2C_ENTER_GAME_ACCEPTED。现役入场路径为 1301-1305。

  MESSAGE_ID_C2S_HEARTBEAT_REQUEST = 1105;
  MESSAGE_ID_S2C_HEARTBEAT_RESPONSE = 1106;

  // Gateway 登录管线(#43):Edge Session 从 pending 迁入 fetching 的
  // 凭据提交;校验链与错误码见主 spec §5.3。
  MESSAGE_ID_C2S_EDGE_ATTACH = 1301;
  MESSAGE_ID_S2C_EDGE_ATTACH_ACCEPTED = 1302;

  // Gateway handoff(#45):拉取完成后服务器推送的直连凭证——
  // EnterRealm 票据 + realm 端点;无对应 C2S,客户端凭票据直连业务服。
  MESSAGE_ID_S2C_ENTER_REALM_GRANTED = 1303;

  // Realm 直连入场(#46):客户端向 realm 提交 1303 下发的票据;
  // realm 单次兑换(回放保护)后受理,会话迁入 established。
  MESSAGE_ID_C2S_ENTER_REALM = 1304;
  MESSAGE_ID_S2C_ENTER_REALM_ACCEPTED = 1305;

  MESSAGE_ID_S2C_ERROR = 1999;
}

enum TransportProtocol {
  TRANSPORT_PROTOCOL_UNSPECIFIED = 0;
  TRANSPORT_PROTOCOL_QUIC = 1;
  TRANSPORT_PROTOCOL_TLS_TCP = 2;
}

message ServiceEndpoint {
  string address = 1;
  uint32 port = 2;
  TransportProtocol protocol = 3;
  uint32 priority = 4;
}

message HeartbeatRequest {}

message HeartbeatResponse {}

// Gateway 登录管线凭据提交:身份 Token(iss=realmmesh/login-verify)+
// admitted 排队号牌(iss=realmmesh/queue)。网关在 pending→fetching
// 迁移处单次消费身份 Token 的 jti。
message EdgeAttach {
  string identity_token = 1;
  string queue_number_token = 2;
}

message EdgeAttachAccepted {
  uint64 account_id = 1;
}

// Gateway handoff(#45):EnterRealm 票据(SessionTicket,60s、单次消费,
// Realm 侧兑换)+ 业务服端点;客户端凭此直连业务服。
message EnterRealmGranted {
  bytes enter_realm_ticket = 1;
  repeated ServiceEndpoint realm_endpoints = 2;
}

// Realm 直连入场(#46):客户端向 realm 提交的兑换请求。
message EnterRealm {
  bytes enter_realm_ticket = 1;
}

// Realm 直连入场(#46):兑换成功受理,会话即业务直连长连接。
message EnterRealmAccepted {
  uint64 account_id = 1;
}

message EdgeError {
  uint32 code = 1;
  string message = 2;
  // 仅瞬时限流结果设置；客户端在此窗口后才重试同一凭据链。
  uint32 retry_after_seconds = 3;
}
